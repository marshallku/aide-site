name: Deploy

# master → checks → ghcr.io/marshallku/aide-site:<sha> → the image tag in marshallku/manifest
# (kubernetes/apps/aide-site/values.yaml) → ArgoCD rolls it out to aide.marshallku.dev.
#
# A newer push cancels an older run, and promote re-checks that its commit is still master's head
# right before it writes, so a slow old build can never roll the site back.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: aide-site-deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aide-site

jobs:
  check:
    name: Format, check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  image:
    name: Build and push the image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: Point the manifest at the image
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: marshallku/manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
      - name: Update the image tag and push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          file=kubernetes/apps/aide-site/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Checked right before every push: a newer master commit deploys itself.
            head=$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)
            if [ "$head" != "$SHA" ]; then
              echo "master moved on to $head; leaving the manifest to its run"
              exit 0
            fi
            sed -i -E "s#(image:[[:space:]]+)ghcr.io/marshallku/aide-site:[^[:space:]]+#\1${IMAGE}:${SHA}#" "$file"
            git add "$file"
            git diff --cached --quiet && exit 0
            git commit -m "deploy(aide-site): update image tag to ${SHA:0:7}"
            git push && exit 0
            git reset --hard HEAD~1
            git pull --rebase
          done
          exit 1

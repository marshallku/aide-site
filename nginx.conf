# Serves the static build (dist) on 8080 as the unprivileged nginx image's user.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The iPhone app's universal links (a community plugin's page opens it in AIDE): JSON, no redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    # Astro fingerprints everything under /_astro/, so it never changes under the same name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
